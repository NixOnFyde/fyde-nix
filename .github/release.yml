# Controls GitHub's auto-generated release notes.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - dependencies
      - automated
    authors:
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: "Fixes"
      labels:
        - bug
    - title: "Features"
      labels:
        - enhancement
    - title: "Documentation"
      labels:
        - documentation
    - title: "Other Changes"
      labels:
        - "*"
