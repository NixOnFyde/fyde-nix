name: "Build & release image"

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # Allows triggering from the GitHub UI

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: false # Just in case

jobs:
  build:
    name: Build & cache
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Accept flake nixConfig
        run: |
          sudo mkdir -p /etc/nix
          echo "accept-flake-config = true" | sudo tee -a /etc/nix/nix.conf
          sudo pkill -HUP nix-daemon || true

      - uses: cachix/cachix-action@v17
        with:
          name: fyde-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          # Exclude large image artifacts from automatic push
          pushFilter: "(-btrfs-fs\\.img$|-fydetab-duo-nixos\\.img\\.zst$)"

      # Keep revisions is set to 1 to prevent uploading so much to Cachix
      # that we go past their 5GB free limit (definitely didn't accidentally
      # do this during testing).
      - name: Build & push system closure
        if: env.CACHIX_AUTH_TOKEN != ''
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          SYSTEM=$(nix build --impure \
            .#nixosConfigurations.example.config.system.build.toplevel \
            --no-link --print-out-paths)

          KERNEL=$(nix build --impure .#packages.aarch64-linux.linux-fydetab \
            --no-link --print-out-paths)

          # Push everything except the large image artifacts, to keep
          # within the free cachix limit.
          nix-store -qR "$SYSTEM" "$KERNEL" \
            | grep -v -E '(btrfs-fs\.img$|fydetab-duo-nixos\.img\.zst$)' \
            | cachix push fyde-nix

          cachix pin fyde-nix system "$SYSTEM" --keep-revisions 1
          cachix pin fyde-nix kernel "$KERNEL" --keep-revisions 1

      - name: Build NixOS image
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          IMAGE=$(nix build --impure -L .#packages.aarch64-linux.image \
            --no-link --print-out-paths)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # The image builder now chowns the seed tree
      # to 0:0 before mkfs.btrfs and seeds /var/run + /var/empty, but I
      # kept a lightweight verify + heal for CI where root is available.
      - name: Verify image ownership & seed dirs
        run: |
          set -euxo pipefail
          WORK=$(mktemp -d)
          zstd -d -f -c "$IMAGE" > "$WORK/img.img"
          LOOP=$(sudo losetup -Pf --show "$WORK/img.img")
          MNT=$(mktemp -d)
          sudo mount "${LOOP}p3" "$MNT"
          # The image builder chowns the seed tree to 0:0, but some
          # sandboxes are not able to chown to uid 0 and the
          # derivation tolerates that; fix up both the store and the
          # image root here where root is available.
          sudo chown root:root "$MNT"
          sudo chown -R root:root "$MNT/nix/store"
          sudo rm -rf "$MNT/var/run"

          # The seed tree has only /nix (+ registration); /var itself is
          # generated by NixOS activation on first boot.
          sudo mkdir -p "$MNT/var"
          sudo ln -s /run "$MNT/var/run"
          sudo mkdir -p "$MNT/var/empty"
          sudo chmod 0755 "$MNT/var/empty"

          # Verify before discarding the mount
          sample=$(find "$MNT/nix/store" -maxdepth 1 -name '*logrotate*' | head -1)
          [ "$(sudo stat -c %u "$sample")" = 0 ]
          [ -L "$MNT/var/run" ] && [ "$(sudo readlink "$MNT/var/run")" = /run ]
          [ -d "$MNT/var/empty" ]

          # Success - unmount!
          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          zstd -T0 --rm -f "$WORK/img.img"
          echo "IMAGE_HEALED=$WORK/img.img.zst" >> "$GITHUB_ENV"

      - name: Verify image is formed correctly
        run: |
          # -f makes zstd follow symlinks, which nix build outputs are.
          zstd -d -f -c "$IMAGE_HEALED" > /tmp/img.img

          sgdisk -p /tmp/img.img | tee layout.txt

          # ESP must contain the GPT legacy_boot bit or vendor U-Boot will
          # skip the medium. sgdisk -p also does not print attributes; so
          # properly query them.
          sgdisk --attributes=2:show /tmp/img.img \
            | grep -qi "legacy BIOS bootable" || {
            echo "::error::ESP missing legacy_boot attribute"; exit 1; }

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: fydetab-duo-nixos.img.zst
          path: ${{ env.IMAGE_HEALED }}
          if-no-files-found: error
          compression-level: 0 # already zstd-compressed

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v8
        with:
          name: fydetab-duo-nixos.img.zst

      - name: Calculate checksums
        run: |
          mv img.img.zst fydetab-duo-nixos.img.zst

          # GitHub release assets must be <2GB; split if needed.
          SIZE=$(stat -c %s fydetab-duo-nixos.img.zst)
          if [ "$SIZE" -gt 2147483648 ]; then
            # MUST BE 2000M NOT 2GB AS LIMIT IS 2GB SO MUST BE <2GB
            split -b 2000M fydetab-duo-nixos.img.zst fydetab-duo-nixos.img.zst.part-
            rm fydetab-duo-nixos.img.zst
          fi

          sha256sum fydetab-duo-nixos.img.zst* > SHA256SUMS
          cat SHA256SUMS

      - name: Release image
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            fydetab-duo-nixos.img.zst*
            SHA256SUMS
