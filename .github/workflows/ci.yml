name: "Build & cache image"

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false # Just in case

jobs:
  lint:
    name: Lint flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Install linters
        run: |
          nix profile install --profile /tmp/lint \
            nixpkgs#nixfmt-rfc-style nixpkgs#statix nixpkgs#deadnix \
            nixpkgs#shellcheck nixpkgs#actionlint

      - name: nixfmt (check)
        run: /tmp/lint/bin/nixfmt --check flake.nix modules overlays pkgs lib

      - name: statix
        run: /tmp/lint/bin/statix check

      - name: deadnix
        run: /tmp/lint/bin/deadnix --fail flake.nix modules overlays pkgs lib

      - name: shellcheck
        run: |
          fail=0
          for s in pkgs/fydetab-snapshot/fydetab-snapshot.sh; do
            [ -f "$s" ] || continue

            # SC2239/SC2123 flag substituteAll template placeholders.
            /tmp/lint/bin/shellcheck -S warning \
              --exclude=SC2239,SC2123 "$s" || fail=1
          done
          exit $fail

      - name: actionlint
        run: /tmp/lint/bin/actionlint

  eval:
    name: Flake evaluations
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Check flake correctly parses and evaluates
        run: |
          nix flake show --all-systems
          nix eval .#nixosConfigurations.example.config.system.build.toplevel.drvPath \
            --raw --impure > /dev/null
        env:
          NIXPKGS_ALLOW_UNFREE: "1"

  build-image:
    name: Build FydeTab Duo image (aarch64)
    runs-on: ubuntu-24.04-arm
    needs: eval

    # PRs by default lint+eval only; manual addition of the build-image
    # label opts a PR into the image build (maintainers only).
    if: github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'build-image')

    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: cachix/cachix-action@v17
        with:
          name: fyde-nix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Build NixOS image
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          IMAGE=$(nix build --impure -L .#packages.aarch64-linux.image \
            --no-link --print-out-paths)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # The Nix sandbox builds the seed tree as an unprivileged user, so the
      # store is owned by uid 1000 (cp cannot chown), and the seed
      # does not contain a /var/run link to /run and openssh's /var/empty.

      # We fix all three here with proper root - as the runner is a full VM.
      # This is what upstream make-disk-image.nix gets "for free" by formatting
      # inside a VM; our custom partition layout (vendor U-Boot) can't use that,
      # so we instead heal post-build instead.
      - name: Heal image ownership & seed dirs
        run: |
          set -euxo pipefail
          WORK=$(mktemp -d)
          zstd -d -f -c "$IMAGE" > "$WORK/img.img"
          LOOP=$(sudo losetup -Pf --show "$WORK/img.img")
          MNT=$(mktemp -d)
          sudo mount "${LOOP}p3" "$MNT"
          sudo chown -R root:root "$MNT/nix/store"
          sudo rm -rf "$MNT/var/run"

          # The seed tree has only /nix (+ registration); /var itself is
          # generated by NixOS activation on first boot.
          sudo mkdir -p "$MNT/var"
          sudo ln -s /run "$MNT/var/run"
          sudo mkdir -p "$MNT/var/empty"
          sudo chmod 0755 "$MNT/var/empty"

          # Verify before discarding the mount
          sample=$(find "$MNT/nix/store" -maxdepth 1 -name '*logrotate*' | head -1)
          [ "$(sudo stat -c %u "$sample")" = 0 ]
          [ -L "$MNT/var/run" ] && [ "$(sudo readlink "$MNT/var/run")" = /run ]
          [ -d "$MNT/var/empty" ]

          # Success - unmount!
          sudo umount "$MNT"
          sudo losetup -d "$LOOP"
          zstd -T0 --rm -f "$WORK/img.img"
          echo "IMAGE_HEALED=$WORK/img.img.zst" >> "$GITHUB_ENV"

      # Keep revisions is set to 1 to prevent uploading so much to Cachix
      # that we go past their 5GB free limit (definitely didn't accidentally
      # do this during testing).
      - name: Push closure & pin on Cachix
        if: github.ref == 'refs/heads/main' && env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          NIXPKGS_ALLOW_UNFREE: "1"

        run: |
          SYSTEM=$(nix build --impure \
            .#nixosConfigurations.example.config.system.build.toplevel \
            --no-link --print-out-paths)

          cachix push fyde-nix "$SYSTEM"

          KERNEL=$(nix build --impure .#packages.aarch64-linux.linux-fydetab \
            --no-link --print-out-paths)
          cachix push fyde-nix "$KERNEL"

          cachix pin fyde-nix system "$SYSTEM" --keep-revisions 1
          cachix pin fyde-nix kernel "$KERNEL" --keep-revisions 1

      - name: Verify image is formed correctly
        run: |
          # -f makes zstd follow symlinks, which nix build outputs are.
          zstd -d -f -c "$IMAGE_HEALED" > /tmp/img.img

          sgdisk -p /tmp/img.img | tee layout.txt

          # ESP must contain the GPT legacy_boot bit or vendor U-Boot will
          # skip the medium. sgdisk -p also does not print attributes; so
          # properly query them.
          sgdisk --attributes=2:show /tmp/img.img \
            | grep -qi "legacy BIOS bootable" || {
            echo "::error::ESP missing legacy_boot attribute"; exit 1; }

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: fydetab-duo-nixos.img.zst
          path: ${{ env.IMAGE_HEALED }}
          if-no-files-found: error
          compression-level: 0 # already zstd-compressed
